      letter-spacing: 3px;

    }

    button {

      border-radius: 40px;
      padding: 13px 24px;
      color: #ffd6e2;
      background: linear-gradient(135deg, #4a1028, #18050d);

      font-size: 14px;
      box-shadow: 0 0 22px #a51c4333;

    }

    #universe {
      display: none;
      min-height: 100vh;
      width: 100%;
      flex-direction: column;
      align-items: center;
      padding: 32px 0 25px;
    }

    h2 {
      color: #f18aaa;
      font-size: clamp(30px, 7vw, 46px);
      text-align: center;

    .subtitle {

      color: #b94c70;
      font: 10px Arial, sans-serif;
      letter-spacing: 2px;
      text-align: center;
    }

    #heart {
      position: relative;
      width: min(96vw, 680px);
      aspect-ratio: 1 / 1;
      flex-shrink: 0;
    }

    #heart-svg {
      position: absolute;
      width: 100%;
      height: 100%;
      inset: 0;
      pointer-events: none;
    }


    #heart-words {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      clip-path: none;
      -webkit-clip-path: none;
    }


    .heart-row {
      position: absolute;
      display: flex;
      align-items: center;
      justify-content: space-around;
      transform: translateX(-50%);
      white-space: nowrap;
      overflow: visible;
    }

    .word {
      display: inline-block;
      flex: 0 0 auto;
      max-width: none;
      color: #e96991;
      font-family: Arial, sans-serif;
      font-weight: 700;
      line-height: 1;
      white-space: nowrap;
      opacity: 0;
      animation: appear .7s ease forwards;
      text-shadow: 0 0 5px #a51c4355;
    }

    .word:nth-child(3n) {
      color: #f49ab5;
    }

    .word:nth-child(5n) {
      color: #c33c68;
    }

    .word:nth-child(7n) {
      color: #ffd0df;
    }

    #message {
      min-height: 65px;
      margin: 12px 10px;
      color: #f18aaa;
      text-align: center;
      font: clamp(17px, 4vw, 26px)/2 Arial, sans-serif;
      transition: opacity .4s ease;
    }

    #status {
      margin: 8px;
      color: #a94b69;
      text-align: center;
      font: 10px Arial, sans-serif;
      letter-spacing: 1px;
    }

    #replay {
      margin-top: 16px;
    }

    @keyframes appear {
      from {
        opacity: 0;
        filter: blur(3px);
      }

      to {
        opacity: 1;
        filter: blur(0);
      }
    }

    @media (max-width: 420px) {
      #heart {
        width: 98vw;
      }

      .heart-row {
        gap: 1px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .word {
        animation-duration: .01ms;
      }
    }
  </style>
</head>

  const lines = [
    "I LOVE YOU",
    "دوستت دارم آرش من",
    "In every language",
    "In every lifetime",
    "It's always you ♥"
  ];

  const intro = document.getElementById("intro");
  const universe = document.getElementById("universe");
  const heart = document.getElementById("heart");
  const heartWords = document.getElementById("heart-words");
  const song = document.getElementById("song");
  const message = document.getElementById("message");
  const status = document.getElementById("status");

  let timers = [];

  function later(callback, delay) {
    const timer = setTimeout(callback, delay);
    timers.push(timer);
  }

  function getUniqueWords() {
    const seen = new Set();

    return words.filter(word => {
      const key = word.trim().toLocaleLowerCase();

      if (seen.has(key)) {
        return false;
      }

      seen.add(key);
      return true;
    });
  }

  /*
   * Standard mathematical heart:
   * (x² + y² - 1)³ - x²y³ <= 0
   *
   * We calculate the inside intervals of each horizontal
   * row, so the top indentation is not filled accidentally.
   */
  function buildHeart() {
    heartWords.innerHTML = "";

    const phrases = getUniqueWords();
    const size = heart.clientWidth;

    const scale = 3.2;
    const yStep = size < 420 ? 0.085 : 0.055;
    const xStep = 0.004;

    let phraseIndex = 0;

    function insideHeart(x, y) {
      const a = x * x + y * y - 1;
      return a * a * a - x * x * y * y * y <= 0;
    }

    for (let y = 1.15; y >= -1.15; y -= yStep) {
      const segments = [];
      let start = null;
      let lastX = -1.4;

      for (let x = -1.4; x <= 1.4; x += xStep) {
        const inside = insideHeart(x, y);

        if (inside && start === null) {
          start = x;
        }

        if (!inside && start !== null) {
          if (lastX - start >= 0.18) {
            segments.push({
              left: start,
              right: lastX
            });
          }

          start = null;
        }

        lastX = x;
      }

      if (start !== null && 1.4 - start >= 0.18) {
        segments.push({
          left: start,
          right: 1.4
        });
      }

      for (const segment of segments) {
        if (phraseIndex >= phrases.length) {
          break;
        }

        const leftPx = size * (0.5 + segment.left / scale);
        const rightPx = size * (0.5 + segment.right / scale);
        const width = rightPx - leftPx;

        const slotWidth = size < 420 ? 58 : 76;
        const count = Math.max(1, Math.floor(width / slotWidth));

        const row = document.createElement("div");
        row.className = "heart-row";
        row.style.left = ((leftPx + rightPx) / 2) + "px";
        row.style.top = (size * (0.5 - y / scale)) + "px";
        row.style.width = width + "px";

        for (
          let i = 0;
          i < count && phraseIndex < phrases.length;
          i++
        ) {
          const phrase = phrases[phraseIndex];
          const span = document.createElement("span");

          span.className = "word";
          span.textContent = phrase;

          const individualWidth = width / count;
          const calculatedFont =
            individualWidth / (phrase.length * 0.62);

          span.style.fontSize =
            Math.max(
              5,
              Math.min(size < 420 ? 7 : 9, calculatedFont)
            ) + "px";

          span.style.animationDelay =
            Math.min(phraseIndex * 0.015, 3) + "s";

          row.appendChild(span);
          phraseIndex++;
        }

        heartWords.appendChild(row);
      }
    }

    status.textContent =
      phraseIndex + " UNIQUE LOVE PHRASES · JUST FOR YOU ♥";
  }

  function startExperience() {
    timers.forEach(clearTimeout);
    timers = [];

    song.pause();
    song.currentTime = 0;

    intro.style.display = "none";
    universe.style.display = "flex";

    buildHeart();

    song.play().catch(() => {
      status.textContent =
        "برای پخش آهنگ، فایل song.mp3 را کنار love.html قرار بده";
    });

    message.textContent = "";

    lines.forEach((line, index) => {
      later(() => {
        message.style.opacity = "0";

        later(() => {
          message.textContent = line;
          message.style.opacity = "1";
        }, 400);
      }, index * 2800);
    });
  }

  document.getElementById("start").addEventListener("click", () => {
    intro.style.opacity = "0";

    later(() => {
      startExperience();
    }, 700);
  });

  document.getElementById("replay").addEventListener("click", () => {
    timers.forEach(clearTimeout);
    timers = [];

    song.pause();
    universe.style.display = "none";
    intro.style.display = "flex";
    intro.style.opacity = "1";
  });

  window.addEventListener("resize", () => {
    if (universe.style.display === "flex") {
      buildHeart();
    }
  });
